        const translations = {

                otpLabel: "Enter OTP",

                changeNum: "рдирд?рдмрд░ рдмрджрд▓рд╛"
            }
        };

        langSwitch.addEventListener('change', (e) => {
            const lang = e.target.value;
            welcomeText.textContent = translations[lang].welcome;
            // Additional translation logic would go here
        });

        function requestOTP() {
            const mobile = document.getElementById('mobile-number').value;
            if (mobile.length === 10) {
                step1.classList.add('hidden-step');
                setTimeout(() => {
                    step1.style.display = 'none';
                    step2.style.display = 'block';
                    setTimeout(() => {
                        step2.classList.remove('hidden-step');
                        otpBoxes[0].focus();
                    }, 50);
                }, 300);
                startTimer();
            } else {
                alert('Please enter a valid 10-digit mobile number.');
            }
        }

        function goBack() {
            step2.classList.add('hidden-step');
            setTimeout(() => {
                step2.style.display = 'none';
                step1.style.display = 'block';
                setTimeout(() => {
                    step1.classList.remove('hidden-step');
                }, 50);
            }, 300);
        }

        // Auto-focus next input for OTP
        otpBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                if (e.target.value && index < otpBoxes.length - 1) {
                    otpBoxes[index + 1].focus();
                }
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpBoxes[index - 1].focus();
                }
            });
        });

        function startTimer() {
            let duration = 119;
            const timerDisplay = document.getElementById('timer');
            const interval = setInterval(() => {
                let minutes = Math.floor(duration / 60);
                let seconds = duration % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                if (--duration < 0) clearInterval(interval);
            }, 1000);
        }
    </script>
